<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#ffffff" />
    <title>VISION-CANE — Mobile Cloud</title>

    <!-- Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', "sans-serif"],
              mono: ['"JetBrains Mono"', "monospace"],
            },
          },
        },
      };
    </script>

    <!-- Leaflet Maps -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Lucide Icons & SweetAlert2 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }

      * {
        -webkit-tap-highlight-color: transparent;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background-color: #f4f6f9;
        color: #09090b;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
        user-select: none;
      }

      /* Fullscreen Map Canvas */
      #map {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      /* Top Header & Map Controls */
      .frosted-panel {
        background-color: rgba(255, 255, 255, 0.8) !important;
        border: 1px solid rgba(228, 228, 231, 0.9);
        box-shadow:
          0 10px 25px -5px rgba(15, 23, 42, 0.12),
          0 4px 10px -2px rgba(15, 23, 42, 0.06);
      }

      .bottom-sheet-50 {
        background-color: rgba(255, 255, 255, 0.8) !important;
        border: 1px solid rgba(255, 255, 255, 0.75) !important;
        box-shadow: 0 12px 30px -6px rgba(15, 23, 42, 0.14);
      }

      /* Sub-kartu di dalam Bottom Sheet (50% Transparan) */
      .bottom-subcard-50 {
        background-color: rgba(255, 255, 255, 0.5) !important;
        border: 1px solid rgba(203, 213, 225, 0.75);
      }

      /* Indikator Titik Biru Google Maps */
      .gmaps-blue-dot {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #1a73e8;
        border: 3px solid #ffffff;
        box-shadow:
          0 0 0 12px rgba(26, 115, 232, 0.24),
          0 4px 12px rgba(0, 0, 0, 0.3);
      }

      /* Glow Merah Saat Bahaya Dekat */
      .danger-pulse-ring {
        animation: dangerGlow 1.2s infinite;
      }
      @keyframes dangerGlow {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.45);
        }
        50% {
          box-shadow: 0 0 0 10px rgba(225, 29, 72, 0);
        }
      }

      /* Floating PiP Camera Transitions */
      .pip-mini {
        width: 156px;
        height: 118px;
      }
      @media (min-width: 640px) {
        .pip-mini {
          width: 240px;
          height: 180px;
        }
      }
      .pip-expanded {
        width: calc(100vw - 24px);
        max-width: 540px;
        height: 50dvh;
        max-height: 400px;
      }

      .leaflet-control-attribution {
        display: none !important;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="relative">
    <!-- 1. PETA GOOGLE MAPS FULLSCREEN -->
    <div id="map"></div>

    <!-- 2. TOP HEADER BAR -->
    <header
      style="top: calc(12px + var(--sat))"
      class="fixed inset-x-3 sm:inset-x-6 z-40 max-w-5xl mx-auto"
    >
      <div
        class="frosted-panel rounded-2xl px-3.5 py-2.5 flex items-center justify-between gap-2"
      >
        <div class="flex items-center gap-2.5 min-w-0">
          <div
            class="w-9 h-9 shrink-0 rounded-xl bg-zinc-950 text-white flex items-center justify-center shadow-sm"
          >
            <i data-lucide="scan-eye" class="w-4 h-4"></i>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <h1
                class="font-extrabold text-xs sm:text-sm tracking-tight text-zinc-950 truncate"
              >
                VISION-CANE
              </h1>
              <span
                id="status-pill"
                class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-zinc-100 text-zinc-700 border border-zinc-300"
              >
                <span
                  id="status-dot"
                  class="w-1.5 h-1.5 rounded-full bg-zinc-500 animate-pulse"
                ></span>
                <span id="status-text">Sync</span>
              </span>
            </div>
            <p
              class="text-[10px] font-mono font-semibold text-zinc-700 truncate"
            >
              ID: VC-3B-8921 •
              <span id="clock-top" class="text-zinc-950">--:--:--</span>
            </p>
          </div>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button
            onclick="bunyikanBuzzer()"
            title="Ping Buzzer Tongkat"
            class="h-9 px-3 rounded-xl bg-white hover:bg-zinc-50 active:scale-95 text-zinc-900 border border-zinc-300 text-xs font-bold flex items-center gap-1.5 transition cursor-pointer"
          >
            <i data-lucide="volume-2" class="w-4 h-4 text-blue-600"></i>
            <span class="hidden sm:inline">Ping</span>
          </button>

          <button
            onclick="kirimSOS()"
            class="h-9 px-3 rounded-xl bg-rose-600 hover:bg-rose-700 active:scale-95 text-white text-xs font-bold flex items-center gap-1.5 shadow-sm shadow-rose-600/30 transition cursor-pointer"
          >
            <i data-lucide="alert-triangle" class="w-4 h-4"></i>
            <span>SOS</span>
          </button>
        </div>
      </div>
    </header>

    <!-- 3. FLOATING PICTURE-IN-PICTURE (PiP) KAMERA YOLOv8 -->
    <div
      id="pip-camera-box"
      style="top: calc(78px + var(--sat)); background-color: #09090b"
      class="fixed right-3 sm:right-6 z-40 pip-mini rounded-2xl overflow-hidden bg-zinc-950 border-2 border-white shadow-2xl transition-all duration-300 flex flex-col"
    >
      <div
        class="absolute top-0 inset-x-0 z-20 px-2.5 py-1.5 bg-zinc-950/90 border-b border-white/10 flex items-center justify-between"
      >
        <div class="flex items-center gap-1.5">
          <span
            id="cam-live-dot"
            class="w-2 h-2 rounded-full bg-zinc-400"
          ></span>
          <span
            id="badge-cam-mode"
            class="font-mono text-[9px] font-bold text-white tracking-wider"
            >YOLOv8</span
          >
        </div>

        <button
          onclick="toggleUkuranKamera()"
          title="Perbesar / Perkecil Kamera"
          class="w-6 h-6 rounded-lg bg-white/15 hover:bg-white/25 text-white flex items-center justify-center transition cursor-pointer"
        >
          <i
            id="icon-expand-cam"
            data-lucide="maximize-2"
            class="w-3.5 h-3.5"
          ></i>
        </button>
      </div>

      <img
        id="yolo-output-img"
        alt="YOLOv8 Cloud Vision"
        onclick="toggleUkuranKamera()"
        class="hidden w-full h-full object-contain bg-zinc-950 cursor-pointer pt-6"
      />

      <div
        id="kamera-placeholder"
        onclick="toggleUkuranKamera()"
        class="w-full h-full flex flex-col items-center justify-center p-3 pt-7 text-center cursor-pointer bg-zinc-950"
      >
        <i data-lucide="camera-off" class="w-5 h-5 text-zinc-400 mb-1"></i>
        <p class="text-[10px] font-bold text-zinc-200 leading-tight">
          Menunggu Kamera
        </p>
      </div>

      <div
        class="absolute bottom-1.5 right-2 z-20 px-2 py-0.5 rounded bg-zinc-950/90 border border-white/15 font-mono text-[9px] font-semibold text-white"
      >
        <span id="last-update">--:--:--</span>
      </div>
    </div>

    <!-- 4. FLOATING MAP CONTROLS -->
    <div
      style="top: calc(78px + var(--sat))"
      class="fixed left-3 sm:left-6 z-30 flex flex-col gap-2"
    >
      <div class="frosted-panel rounded-xl p-1 flex flex-col gap-1">
        <button
          onclick="ubahTipePeta('street')"
          id="btn-map-street"
          class="px-2.5 py-1.5 rounded-lg bg-blue-600 text-white text-[10px] font-bold shadow-2xs transition cursor-pointer"
        >
          Peta
        </button>
        <button
          onclick="ubahTipePeta('satelit')"
          id="btn-map-satelit"
          class="px-2.5 py-1.5 rounded-lg text-zinc-800 hover:bg-white text-[10px] font-bold transition cursor-pointer"
        >
          Satelit
        </button>
      </div>

      <button
        onclick="fokusPeta()"
        title="Pusatkan ke Lokasi Tongkat"
        class="frosted-panel w-10 h-10 rounded-xl flex items-center justify-center text-blue-600 active:scale-95 transition cursor-pointer"
      >
        <i data-lucide="crosshair" class="w-5 h-5"></i>
      </button>

      <button
        onclick="toggleAutoFollow()"
        id="btn-auto-follow"
        title="Ikuti Pergerakan Otomatis"
        class="frosted-panel w-10 h-10 rounded-xl flex items-center justify-center text-blue-600 active:scale-95 transition cursor-pointer"
      >
        <i data-lucide="navigation-2" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- 5. BOTTOM SHEET PANEL KETERANGAN (BG 50% TRANSPARAN, TULISAN SOLID, TANPA HOVER KUNING/ORANYE) -->
    <section
      style="bottom: calc(12px + var(--sab))"
      class="fixed inset-x-3 sm:inset-x-6 z-40 max-w-2xl mx-auto"
    >
      <div
        id="bottom-sheet-card"
        class="bottom-sheet-50 rounded-3xl p-4 sm:p-5"
      >
        <!-- Drag Handle Visual -->
        <div class="w-10 h-1 rounded-full bg-zinc-400 mx-auto mb-3"></div>

        <!-- Baris 1: Status Keamanan Jalur & Tombol Rute Eksternal -->
        <div class="flex items-center justify-between gap-3 mb-3">
          <div class="flex items-center gap-2.5 min-w-0">
            <div
              id="icon-safety-wrap"
              class="w-10 h-10 shrink-0 rounded-2xl bg-emerald-100 border border-emerald-300 flex items-center justify-center text-emerald-700"
            >
              <i
                id="icon-safety"
                data-lucide="shield-check"
                class="w-5 h-5"
              ></i>
            </div>
            <div class="min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="text-[11px] font-bold text-zinc-900"
                  >Status Jalur</span
                >
                <span
                  id="badge-bahaya-sub"
                  class="text-[10px] font-extrabold px-1.5 py-0.5 rounded-md bg-emerald-100 text-emerald-800 border border-emerald-300"
                  >CLEAR</span
                >
              </div>
              <p
                id="val-bahaya"
                class="text-base sm:text-lg font-extrabold tracking-tight text-zinc-950 truncate"
              >
                AMAN
              </p>
            </div>
          </div>

          <a
            id="btn-gmaps-external"
            href="https://www.google.com/maps?q=-7.8196023,110.3454579"
            target="_blank"
            class="shrink-0 h-10 px-3.5 rounded-2xl bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-xs font-bold flex items-center gap-1.5 shadow-sm shadow-blue-600/30 transition"
          >
            <i data-lucide="map" class="w-4 h-4"></i>
            <span>Google Maps</span>
          </a>
        </div>

        <!-- Baris 2: Keterangan Objek Terdeteksi -->
        <div
          class="bottom-subcard-50 rounded-2xl px-3 py-2.5 mb-3 flex items-center gap-2"
        >
          <i data-lucide="radar" class="w-4 h-4 text-blue-600 shrink-0"></i>
          <div
            id="yolo-tags"
            class="flex items-center gap-1.5 overflow-x-auto no-scrollbar whitespace-nowrap text-xs"
          >
            <span class="font-bold text-emerald-800"
              >Jalur depan aman / bebas rintangan</span
            >
          </div>
        </div>

        <!-- Baris 3: 3 Metrik Ringkas -->
        <div class="grid grid-cols-3 gap-2">
          <div class="bottom-subcard-50 rounded-2xl px-3 py-2 text-center">
            <p class="text-[10px] font-bold text-zinc-700">Objek</p>
            <p class="text-sm font-extrabold text-zinc-950 mt-0.5">
              <span id="val-objek-count">0</span>
              <span class="text-[10px] font-semibold text-zinc-700">aktif</span>
            </p>
          </div>

          <div class="bottom-subcard-50 rounded-2xl px-3 py-2 text-center">
            <p class="text-[10px] font-bold text-zinc-700">Jarak</p>
            <p class="text-sm font-extrabold text-zinc-950 mt-0.5">
              <span id="val-jarak">0.00</span>
              <span class="text-[10px] font-semibold text-zinc-700">km</span>
            </p>
          </div>

          <div class="bottom-subcard-50 rounded-2xl px-3 py-2 text-center">
            <p class="text-[10px] font-bold text-zinc-700">Tujuan</p>
            <p
              id="val-tujuan"
              class="text-xs font-extrabold text-blue-700 mt-1 truncate"
            >
              Tidak Ada
            </p>
          </div>
        </div>

        <!-- Footer Koordinat -->
        <div
          class="mt-2.5 pt-2 border-t border-zinc-300/70 flex items-center justify-between text-[10px] text-zinc-900 font-mono font-bold"
        >
          <span id="val-koordinat">-7.819602, 110.345458</span>
          <button
            onclick="toggleStream()"
            class="font-sans font-bold text-blue-700 cursor-pointer"
          >
            <span id="txt-stream">Titik Koordinat</span>
          </button>
        </div>
      </div>
    </section>

    <!-- TOAST NOTIFIKASI -->
    <div
      id="toast"
      style="top: calc(74px + var(--sat))"
      class="fixed left-1/2 -translate-x-1/2 opacity-0 pointer-events-none transition-all duration-300 z-50 bg-zinc-950/90 backdrop-blur-md text-white px-4 py-2 rounded-full shadow-xl border border-zinc-700 text-xs font-bold flex items-center gap-2 whitespace-nowrap"
    >
      <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
      <span id="toast-msg">Notifikasi</span>
    </div>

    <script>
      lucide.createIcons();

      // ==========================================
      // 1. INISIALISASI PETA GOOGLE MAPS FULLSCREEN
      // ==========================================
      const DEFAULT_ZOOM = 16;
      let latNow = -7.8196023;
      let lonNow = 110.3454579;
      let prevLat = null,
        prevLon = null,
        totalKm = 0,
        firstLoad = true;
      let streamAktif = true;
      let autoFollowAktif = true;
      let kameraDiperbesar = false;
      let statusBahayaSebelumnya = "AMAN";

      const map = L.map("map", { zoomControl: false }).setView(
        [latNow, lonNow],
        DEFAULT_ZOOM,
      );

      const googleStreetLayer = L.tileLayer(
        "https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}",
        { maxZoom: 21 },
      );

      const googleHybridLayer = L.tileLayer(
        "https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}",
        { maxZoom: 21 },
      );

      googleStreetLayer.addTo(map);

      function ubahTipePeta(tipe) {
        const btnStreet = document.getElementById("btn-map-street");
        const btnSatelit = document.getElementById("btn-map-satelit");

        if (tipe === "satelit") {
          map.removeLayer(googleStreetLayer);
          googleHybridLayer.addTo(map);
          btnSatelit.className =
            "px-2.5 py-1.5 rounded-lg bg-blue-600 text-white text-[10px] font-bold shadow-2xs transition cursor-pointer";
          btnStreet.className =
            "px-2.5 py-1.5 rounded-lg text-zinc-800 hover:bg-white text-[10px] font-bold transition cursor-pointer";
        } else {
          map.removeLayer(googleHybridLayer);
          googleStreetLayer.addTo(map);
          btnStreet.className =
            "px-2.5 py-1.5 rounded-lg bg-blue-600 text-white text-[10px] font-bold shadow-2xs transition cursor-pointer";
          btnSatelit.className =
            "px-2.5 py-1.5 rounded-lg text-zinc-800 hover:bg-white text-[10px] font-bold transition cursor-pointer";
        }
      }

      const googleBlueDot = L.divIcon({
        className: "",
        html: `<div class="gmaps-blue-dot"></div>`,
        iconSize: [22, 22],
        iconAnchor: [11, 11],
      });

      const marker = L.marker([latNow, lonNow], { icon: googleBlueDot }).addTo(
        map,
      );
      const routeLine = L.polyline([], {
        color: "#1A73E8",
        weight: 5,
        opacity: 0.9,
      }).addTo(map);

      function fokusPeta() {
        map.flyTo([latNow, lonNow], DEFAULT_ZOOM, { duration: 0.6 });
        showToast("Peta dipusatkan ke lokasi tongkat");
      }

      function toggleAutoFollow() {
        autoFollowAktif = !autoFollowAktif;
        const btn = document.getElementById("btn-auto-follow");
        if (autoFollowAktif) {
          btn.className =
            "frosted-panel w-10 h-10 rounded-xl flex items-center justify-center text-blue-600 active:scale-95 transition cursor-pointer";
          showToast("Auto-ikuti lokasi aktif");
          map.panTo([latNow, lonNow]);
        } else {
          btn.className =
            "frosted-panel w-10 h-10 rounded-xl flex items-center justify-center text-zinc-500 active:scale-95 transition cursor-pointer";
          showToast("Auto-ikuti lokasi dimatikan");
        }
      }

      function toggleUkuranKamera() {
        kameraDiperbesar = !kameraDiperbesar;
        const box = document.getElementById("pip-camera-box");
        const icon = document.getElementById("icon-expand-cam");

        if (kameraDiperbesar) {
          box.classList.remove("pip-mini");
          box.classList.add("pip-expanded");
          icon.setAttribute("data-lucide", "minimize-2");
        } else {
          box.classList.remove("pip-expanded");
          box.classList.add("pip-mini");
          icon.setAttribute("data-lucide", "maximize-2");
        }
        lucide.createIcons();
      }

      function haversineKm(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = ((lat2 - lat1) * Math.PI) / 180;
        const dLon = ((lon2 - lon1) * Math.PI) / 180;
        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos((lat1 * Math.PI) / 180) *
            Math.cos((lat2 * Math.PI) / 180) *
            Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      // ==========================================
      // 2. KONTROL STREAM & HUD VISUAL
      // ==========================================
      function toggleStream() {
        streamAktif = !streamAktif;
        const txtBtn = document.getElementById("txt-stream");
        if (streamAktif) {
          txtBtn.innerText = "● Live Sync Aktif";
          txtBtn.className = "font-sans font-bold text-blue-700";
          showToast("Sinkronisasi dilanjutkan");
          ambilDataFirebase();
        } else {
          txtBtn.innerText = "❚❚ Sync Dijeda";
          txtBtn.className = "font-sans font-bold text-zinc-700";
          showToast("Sinkronisasi dijeda");
        }
      }

      function perbaruiHudFirebase(objekList, jml, bahaya, waktuLokal) {
        document.getElementById("val-objek-count").innerText = jml;
        document.getElementById("last-update").innerText = waktuLokal
          ? waktuLokal.split(" ").pop()
          : new Date().toTimeString().split(" ")[0];

        const elBahaya = document.getElementById("val-bahaya");
        const subBahaya = document.getElementById("badge-bahaya-sub");
        const iconWrap = document.getElementById("icon-safety-wrap");

        elBahaya.innerText = bahaya;

        if (bahaya.includes("BAHAYA")) {
          elBahaya.className =
            "text-base sm:text-lg font-extrabold tracking-tight text-rose-600 truncate";
          subBahaya.innerText = "ALERT";
          subBahaya.className =
            "text-[10px] font-extrabold px-1.5 py-0.5 rounded-md bg-rose-100 text-rose-800 border border-rose-300";
          iconWrap.className =
            "w-10 h-10 shrink-0 rounded-2xl bg-rose-100 border border-rose-300 flex items-center justify-center text-rose-700 danger-pulse-ring";

          if (statusBahayaSebelumnya !== bahaya && navigator.vibrate) {
            navigator.vibrate([250, 100, 250]);
          }
        } else if (bahaya === "WASPADA") {
          elBahaya.className =
            "text-base sm:text-lg font-extrabold tracking-tight text-zinc-950 truncate";
          subBahaya.innerText = "CAUTION";
          subBahaya.className =
            "text-[10px] font-extrabold px-1.5 py-0.5 rounded-md bg-zinc-200 text-zinc-900 border border-zinc-400";
          iconWrap.className =
            "w-10 h-10 shrink-0 rounded-2xl bg-zinc-200 border border-zinc-400 flex items-center justify-center text-zinc-900";
        } else {
          elBahaya.className =
            "text-base sm:text-lg font-extrabold tracking-tight text-zinc-950 truncate";
          subBahaya.innerText = "CLEAR";
          subBahaya.className =
            "text-[10px] font-extrabold px-1.5 py-0.5 rounded-md bg-emerald-100 text-emerald-800 border border-emerald-300";
          iconWrap.className =
            "w-10 h-10 shrink-0 rounded-2xl bg-emerald-100 border border-emerald-300 flex items-center justify-center text-emerald-700";
        }

        statusBahayaSebelumnya = bahaya;

        const tagContainer = document.getElementById("yolo-tags");
        const adaObjekAsli =
          jml > 0 &&
          objekList.length > 0 &&
          objekList[0] !== "Area aman / kosong";

        if (!adaObjekAsli) {
          tagContainer.innerHTML = `<span class="font-bold text-emerald-800">Jalur depan aman / bebas rintangan</span>`;
        } else {
          tagContainer.innerHTML = objekList
            .map(
              (o) =>
                `<span class="px-2.5 py-0.5 rounded-lg bg-white text-zinc-950 text-[11px] font-bold border border-zinc-300">${o}</span>`,
            )
            .join("");
        }
      }

      // ==========================================
      // 3. SINKRONISASI KAMERA LIVE & GPS FIREBASE
      // ==========================================
      const FIREBASE_BASE =
        "https://vision-cb8b3-default-rtdb.asia-southeast1.firebasedatabase.app/perangkat/VC-3B-8921";

      setInterval(() => {
        document.getElementById("clock-top").innerText = new Date()
          .toTimeString()
          .split(" ")[0];
      }, 1000);

      async function ambilDataFirebase() {
        if (!streamAktif) return;

        try {
          const res = await fetch(`${FIREBASE_BASE}.json`);
          const data = await res.json();
          if (!data) return;

          const online =
            Math.floor(Date.now() / 1000) - (data.timestamp || 0) <= 15;
          const pill = document.getElementById("status-pill");
          const dot = document.getElementById("status-dot");
          const txt = document.getElementById("status-text");

          if (online) {
            pill.className =
              "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300";
            dot.className =
              "w-1.5 h-1.5 rounded-full bg-emerald-600 animate-pulse";
            txt.innerText = "Online";
          } else {
            pill.className =
              "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-zinc-200 text-zinc-700 border border-zinc-300";
            dot.className = "w-1.5 h-1.5 rounded-full bg-zinc-500";
            txt.innerText = "Offline";
          }

          const yoloImg = document.getElementById("yolo-output-img");
          const ph = document.getElementById("kamera-placeholder");
          const badgeCam = document.getElementById("badge-cam-mode");
          const dotCam = document.getElementById("cam-live-dot");

          if (
            data.gambar_live &&
            typeof data.gambar_live === "string" &&
            data.gambar_live.startsWith("data:image")
          ) {
            yoloImg.src = data.gambar_live;
            yoloImg.classList.remove("hidden");
            ph.classList.add("hidden");

            if (online) {
              badgeCam.innerText = "LIVE";
              dotCam.className =
                "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
            } else {
              badgeCam.innerText = "LAST";
              dotCam.className = "w-2 h-2 rounded-full bg-zinc-300";
            }
          } else {
            yoloImg.classList.add("hidden");
            ph.classList.remove("hidden");
            badgeCam.innerText = "STANDBY";
            dotCam.className = "w-2 h-2 rounded-full bg-zinc-400";
          }

          perbaruiHudFirebase(
            data.objek_terdeteksi || [],
            data.jumlah_objek || 0,
            data.status_bahaya || "AMAN",
            data.waktu_lokal || "",
          );

          const lat = parseFloat(data.latitude);
          const lon = parseFloat(data.longitude);
          if (!isNaN(lat) && !isNaN(lon)) {
            if (prevLat !== null && prevLon !== null) {
              const stepKm = haversineKm(prevLat, prevLon, lat, lon);
              if (stepKm > 0.0005 && stepKm < 1.0) totalKm += stepKm;
            }
            prevLat = lat;
            prevLon = lon;
            latNow = lat;
            lonNow = lon;

            document.getElementById("val-koordinat").innerText =
              `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
            document.getElementById("val-jarak").innerText = totalKm.toFixed(2);
            document.getElementById("btn-gmaps-external").href =
              `https://www.google.com/maps?q=${lat},${lon}`;

            marker.setLatLng([lat, lon]);
            routeLine.addLatLng([lat, lon]);

            if (firstLoad) {
              map.setView([lat, lon], DEFAULT_ZOOM);
              firstLoad = false;
            } else if (autoFollowAktif) {
              map.panTo([lat, lon]);
            }
          }

          document.getElementById("val-tujuan").innerText = data.sedang_navigasi
            ? data.tujuan
            : "Tidak Ada";
        } catch (e) {
          console.error(e);
        }
      }

      ambilDataFirebase();
      setInterval(ambilDataFirebase, 1500);

      // ==========================================
      // 4. AKSI TOMBOL PING & SOS (SWEETALERT2)
      // ==========================================
      async function bunyikanBuzzer() {
        if (navigator.vibrate) navigator.vibrate(80);
        showToast("Sinyal ping dikirim ke tongkat");
        try {
          await fetch(`${FIREBASE_BASE}/perintah_buzzer.json`, {
            method: "PUT",
            body: JSON.stringify({
              aktif: true,
              waktu: Math.floor(Date.now() / 1000),
            }),
          });
        } catch (e) {}
      }

      async function kirimSOS() {
        if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
        const konfirmasi = await Swal.fire({
          title: "Kirim Sinyal SOS?",
          text: "Status darurat akan langsung dikirim ke sistem pemantau tongkat.",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#e11d48",
          cancelButtonColor: "#52525b",
          confirmButtonText: "Ya, Aktifkan SOS",
          cancelButtonText: "Batal",
          customClass: {
            popup: "rounded-3xl font-sans",
          },
        });

        if (!konfirmasi.isConfirmed) return;

        showToast("Sinyal darurat SOS diaktifkan!");
        try {
          await fetch(`${FIREBASE_BASE}/status_darurat.json`, {
            method: "PUT",
            body: JSON.stringify({
              sos: true,
              waktu: new Date().toISOString(),
            }),
          });
        } catch (e) {}
      }

      function showToast(msg) {
        const t = document.getElementById("toast");
        document.getElementById("toast-msg").innerText = msg;
        t.classList.remove("opacity-0", "pointer-events-none");
        setTimeout(
          () => t.classList.add("opacity-0", "pointer-events-none"),
          2800,
        );
      }
    </script>
  </body>
</html>
